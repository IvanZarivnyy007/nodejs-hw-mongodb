tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user.
security:
  - bearerAuth: [] 

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
        properties:
          name:
            type: string
            description: Name of the contact.
            example: John Doe
          email:
            type: string
            description: Email address of the contact.
            example: johndoe@example.com
          phoneNumber:
            type: string
            description: Phone number of the contact.
            example: "+1234567890"
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favorite.
            example: false
          contactType:
            type: String
            enum: ['work', 'home', 'personal']
            required: true
            example: 'personal'
          photo:
            type: string
            format: binary
            description: Profile picture of the contact.

responses:
  201:
    description: Successfully created a new contact.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a new contact!
            data:
              $ref: "../../components/schemas/contact.yaml"
  400:
    $ref: "../../components/responses/400.yaml"
  401:
    $ref: "../../components/responses/401.yaml"
  500:
    $ref: "../../components/responses/500.yaml"
