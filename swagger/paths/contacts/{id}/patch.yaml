tags:
  - Contacts
summary: Update a contact by ID
operationId: updateContact
description: Update the details of a contact by its ID.
security:
  - bearerAuth: []

parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: "63f1c8f1d2a5b9e1a87f3c1a"

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Updated name of the contact.
            example: Jane Doe
          email:
            type: string
            description: Updated email of the contact.
            example: janedoe@example.com
          phoneNumber:
            type: string
            description: Updated phone number of the contact.
            example: "+9876543210"
          isFavourite:
            type: boolean
            description: Updated favorite status of the contact.
            example: true
          contactType:
            type: string
            description: Updated type of the contact.
            enum:
              - personal
              - work
              - other
            example: personal
          photo:
            type: string
            format: binary
            description: Updated photo.

responses:
  200:
    description: Successfully updated the contact.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated the contact!
            data:
              $ref: "../../../components/schemas/contact.yaml"
  400:
    $ref: "../../../components/responses/400.yaml"
  401:
    $ref: "../../../components/responses/401.yaml"
  404:
    $ref: "../../../components/responses/404.yaml"
  500:
    $ref: "../../../components/responses/500.yaml"
