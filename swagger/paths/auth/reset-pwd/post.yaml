tags:
  - Auth
summary: Password Reset
operationId: Password Reset
description: Password Reset
security: []

requestBody: 
  content: 
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties: 
          token:
            description: Enter jwt token
            type: string
            example: "sdvaiqj456ecdcr.dwefrefrefre.frefewfre"
          password:
            description: Enter new password
            type: string
            example: qwerty2025

responses:
  200:
    description: Password has been successfully reset.!
    content: 
      application/json:
        schema:
          type: object
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.!
