tags:
  - Auth
summary: User Refresh Token
operationId: UserRefreshToken
description: User Refresh Token
security: []


responses:
  200:
    description: Successfully refreshed a session!
    content: 
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: Successfully refreshed a session!
                  example: "Hello Kitty"
