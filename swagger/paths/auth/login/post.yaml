tags:
  - Auth
summary: User Login
operationId: UserLogin
description: User Login
security: []

requestBody: 
  content: 
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties: 
          email:
            description: Enter your Email
            type: string
            example: qwerty2025@gmail.com
          password:
            description: Enter your Password
            type: string
            example: qwrrtyu2025

responses:
  200:
    description: Successfully logged in the user!
    content: 
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in the user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: Access token for the user
                  example: "vtrh35fx435ghyjtkbjb67"
                refreshToken:
                  type: string
                  description: Refresh token for the user
                  example: "qweftrynmykyunbegbymjb"
